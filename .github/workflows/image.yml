name: Server image

# Builds the server image on every PR (no push) and publishes it to GHCR on
# main. The droplet (deploy/droplet) will pull ghcr.io/changeplusplusvandy/civicdesigncenter:main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/changeplusplusvandy/civicdesigncenter:main
            ghcr.io/changeplusplusvandy/civicdesigncenter:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
