#cloud-config
# First-boot setup for the staging VM (Ubuntu 24.04, Standard_B1s, 1 GB RAM).
package_update: true
packages:
  - docker.io
  - docker-compose-v2
swap:
  filename: /swapfile
  size: 1G
runcmd:
  - systemctl enable --now docker
  - usermod -aG docker azureuser
  - mkdir -p /opt/citysettlers
  - chown azureuser:azureuser /opt/citysettlers
