# Staging on the Azure VM: the game server plus a Cloudflare named tunnel.
# No inbound ports are opened: cloudflared connects out to Cloudflare, and the
# tunnel's public hostname routes to http://server:3000.
# Secrets come from /opt/citysettlers/.env on the VM (see README.md here).
services:
  server:
    image: ghcr.io/changeplusplusvandy/civicdesigncenter:main
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - server
