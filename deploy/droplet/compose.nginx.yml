# Server only, on localhost (no proxy): for a host whose 80/443 are taken.
# Select it with COMPOSE_FILE=compose.nginx.yml in /opt/citysettlers/.env.
name: citysettlers

services:
  server:
    image: ghcr.io/changeplusplusvandy/civicdesigncenter:main
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
